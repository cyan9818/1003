<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>彩虹公路小賽車</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Chango&display=swap">
<style>
/* 版面：三個畫面（首頁 → 房間大廳 → 賽道）。賽道畫面讓畫布佔滿手機螢幕，HUD 疊在畫布上方，左右按鈕在下方 */
:root{
  color-scheme:light;
  --bg:#e9f6ff; --fg:#17324a; --muted:#5c7890; --card:#ffffff; --line:#c6dcee;
  --accent:#ff5a3c; --accent-fg:#ffffff; --road:#4a5668; --grass:#8fd46a; --lane:#f6f1d4; --coin:#ffc928;
  --good:#1b8a4b; --good-bg:#dff3e6; --hud:rgba(255,255,255,.88);
  --font-display:"Chango","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1c2b; --fg:#e6f1fb; --muted:#8fa9c0; --card:#182a3f; --line:#2a4260;
  --accent:#ff7a5c; --accent-fg:#1a0d08; --road:#2b3441; --grass:#2f6b3f; --lane:#d9d3a8; --coin:#ffd34d;
  --good:#5fd58a; --good-bg:#16382a; --hud:rgba(24,42,63,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c2b; --fg:#e6f1fb; --muted:#8fa9c0; --card:#182a3f; --line:#2a4260;
  --accent:#ff7a5c; --accent-fg:#1a0d08; --road:#2b3441; --grass:#2f6b3f; --lane:#d9d3a8; --coin:#ffd34d;
  --good:#5fd58a; --good-bg:#16382a; --hud:rgba(24,42,63,.88); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding-inline:12px;padding-block:12px}
[hidden]{display:none!important}
.screen{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--font-display);font-size:1.5rem;margin:0;color:var(--accent);letter-spacing:.02em;line-height:1.2}
h2{margin:0;font-size:1.05rem}
.btn{font:inherit;font-weight:700;border:2px solid var(--fg);background:var(--card);color:var(--fg);border-radius:14px;padding:10px 16px;cursor:pointer;min-height:48px;box-shadow:0 3px 0 var(--fg)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.small{min-height:40px;padding:4px 12px;font-size:.9rem;box-shadow:0 2px 0 var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.field:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.field{flex:1;min-width:0;font:inherit;font-size:1rem;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);min-height:48px}
#code{text-transform:uppercase;letter-spacing:.2em;text-align:center;font-weight:700}
label.cap{font-size:.8rem;color:var(--muted)}
.status{font-size:.85rem;color:var(--muted);margin:0;line-height:1.5}
.status.err{color:var(--accent)}
ol,ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg)}
li.me{outline:2px solid var(--accent)}
li .nm{min-width:0;overflow-wrap:anywhere}
li .sc{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--accent-fg);margin-left:6px;vertical-align:middle}
.badge.good{background:var(--good-bg);color:var(--good)}
.invite{background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:700}
.room-code{font-family:var(--font-display);font-size:3rem;letter-spacing:.15em;color:var(--accent);line-height:1;text-align:center}
.note{color:var(--muted);font-size:.8rem;line-height:1.6;margin:0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--good);width:0}
.rl{flex:1;min-width:0}

/* 賽道畫面 */
#play{gap:8px;min-height:calc(100dvh - 24px)}
.stage{position:relative;border:3px solid var(--fg);border-radius:16px;overflow:hidden;background:var(--grass);touch-action:none}
canvas{display:block;width:100%;height:auto}
.hud{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:5px;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{background:var(--hud);border-radius:10px;padding:3px 8px;font-size:.78rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--fg)}
.chip small{color:var(--muted);font-weight:400;margin-right:3px}
.hud .sp{flex:1}
.ibtn{font:inherit;border:0;border-radius:10px;background:var(--hud);color:var(--fg);width:36px;height:30px;cursor:pointer;font-weight:700}
.mini{position:absolute;top:42px;left:6px;right:6px;display:flex;gap:5px;overflow:hidden;pointer-events:none}
.mini span{font-size:.72rem;font-weight:700;white-space:nowrap;background:var(--hud);border-radius:999px;padding:2px 8px;color:var(--fg)}
.mini span.me{outline:2px solid var(--accent)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:color-mix(in srgb,var(--bg) 84%,transparent);overflow:auto}
.overlay h2{font-family:var(--font-display);font-size:1.7rem;color:var(--accent)}
.overlay h2.big{font-size:4rem}
.overlay p{margin:0;max-width:26ch;line-height:1.6}
.overlay ul{width:100%;max-width:300px;text-align:left}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:320px}
.lv{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:6px 2px;cursor:pointer;line-height:1.25}
.lv b{display:block;font-size:.85rem}.lv small{font-size:.7rem;color:var(--muted)}.lv span{font-size:1.3rem}
.lv[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.lv:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad .btn{font-size:1.5rem;padding:10px;min-height:60px}
#home .top h1{font-size:1.25rem}
.modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);color:var(--fg);border-radius:18px;padding:16px;width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>

<!-- 首頁 -->
<main class="screen" id="home">
  <div class="top">
    <h1>彩虹公路小賽車</h1>
    <div class="row">
      <button class="btn small" id="openBoard" type="button">🏆 排行榜</button>
      <button class="btn small" id="theme1" type="button" aria-label="切換深色或淺色模式">🌓</button>
    </div>
  </div>
  <section class="card">
    <div id="invite" class="invite" hidden></div>
    <label class="cap" for="nick">你的暱稱（已幫你取好，可以改）</label>
    <div class="row">
      <input class="field" id="nick" maxlength="12" autocomplete="nickname">
      <button class="btn small" id="dice" type="button" aria-label="換一個暱稱">🎲 換一個</button>
    </div>
    <button class="btn primary" id="create" type="button">建立房間，邀請朋友</button>
    <div class="row">
      <input class="field" id="code" maxlength="4" placeholder="輸入 4 碼房號" autocomplete="off" autocapitalize="characters" aria-label="房號">
      <button class="btn" id="join" type="button">加入</button>
    </div>
    <button class="btn" id="solo" type="button">個人遊玩</button>
    <p class="status" id="homeMsg"></p>
  </section>
  <p class="note">操作：手機點畫面左右半邊、按下方按鈕或左右滑動；電腦用 ← → 或 A D。每場 3 條命，撞車扣一條，金幣加分。分數會自動上傳世界排行榜。</p>
  <p class="note">隱私說明：為了統計與防止作弊，多人比賽會記錄連線地區（IP 只保留前三段）、裝置與瀏覽器資訊，以及該場成績，不會公開。</p>
</main>

<!-- 房間大廳 -->
<main class="screen" id="lobby" hidden>
  <div class="top">
    <h1>房間大廳</h1>
    <button class="btn small" id="theme2" type="button" aria-label="切換深色或淺色模式">🌓</button>
  </div>
  <section class="card">
    <label class="cap">房號（告訴朋友，或複製邀請連結）</label>
    <div class="room-code" id="roomCode">----</div>
    <button class="btn primary" id="share" type="button">分享給朋友（LINE 等）</button>
    <button class="btn" id="copy" type="button">複製邀請連結</button>
    <p class="status" id="phaseText"></p>
    <ul id="plist"></ul>
    <button class="btn primary" id="startRace" type="button">開始比賽</button>
    <button class="btn small" id="leave" type="button">離開房間</button>
  </section>
</main>

<!-- 賽道 -->
<main class="screen" id="play" hidden>
  <div class="stage" id="stage">
    <canvas id="cv" width="360" height="560"></canvas>
    <div class="hud" aria-live="polite">
      <button class="ibtn" id="exit" type="button" aria-label="離開">✕</button>
      <span class="chip"><small>距離</small><span id="dist">0 m</span></span>
      <span class="chip"><small>金幣</small><span id="coins">0</span></span>
      <span class="chip" id="lives">♥♥♥</span>
      <span class="chip" id="lvChip" hidden></span>
      <span class="sp"></span>
      <button class="ibtn" id="pause" type="button" aria-label="暫停">⏸</button>
      <button class="ibtn" id="theme3" type="button" aria-label="切換深色或淺色模式">🌓</button>
    </div>
    <div class="mini" id="mini" hidden></div>
    <div class="overlay" id="ov">
      <h2 id="ovT"></h2>
      <p id="ovP"></p>
      <ul id="ovList" hidden></ul>
      <div class="lvs" id="ovLv" hidden></div>
      <button class="btn primary" id="go" type="button"></button>
      <button class="btn small" id="alt" type="button"></button>
      <button class="btn small" id="boardBtn" type="button" hidden>🏆 世界排行榜</button>
    </div>
  </div>
  <div class="pad">
    <button class="btn" id="L" type="button" aria-label="向左換道">◀</button>
    <button class="btn" id="R" type="button" aria-label="向右換道">▶</button>
  </div>
</main>

<div class="modal" id="boardModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="boardTitle">
    <div class="top"><h2 id="boardTitle">🏆 世界排行榜</h2><button class="btn small" id="closeBoard" type="button" aria-label="關閉">✕</button></div>
    <p class="status" id="status">連線中…</p>
    <ol id="board"></ol>
    <button class="btn small" id="refreshBoard" type="button">重新整理</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var W=360,H=560,LANES=3,LW=W/LANES,GOAL=1500;
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var $=function(i){return document.getElementById(i)};
  var cs=getComputedStyle(document.documentElement);
  function tok(n){return cs.getPropertyValue(n).trim()}
  function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  var SB_URL='https://vkpzblltqznkvgfnjcdp.supabase.co';
  var KEY='sb_publishable_N6kWoe_b_ego0YqWMAPVtg_jNzcB96D';
  var HD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
  var sb=null;
  try{if(window.supabase)sb=window.supabase.createClient(SB_URL,KEY,{realtime:{params:{eventsPerSecond:10}}})}catch(e){}

  var state='ready',lane=1,px=LW*1.5,speed=0,dist=0,wd=0,nextAt=0,coins=0,lives=3,inv=0,items=[],scroll=0,last=0,best=0,shake=0,finished=false;
  var rnd=Math.random,mp=null,actGo=null,actAlt=null;
  var demo=[['小橘',3820],['阿豪',3140],['Mia',2680],['大雄',2210],['小海',1760],['路過的鴨',1200]];
  var carColors=['#3b82f6','#a855f7','#10b981','#f97316','#ec4899'];
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  var LEVELS=[
    {e:'🐌',n:'蝸牛',d:'很慢',b:110,g:.5,m:300,gap:1.3,x:.6},
    {e:'🐢',n:'烏龜',d:'慢',b:145,g:.75,m:400,gap:1.15,x:.8},
    {e:'🐇',n:'兔子',d:'標準',b:180,g:1,m:520,gap:1,x:1},
    {e:'🐎',n:'駿馬',d:'快',b:220,g:1.2,m:620,gap:.92,x:1.2},
    {e:'🐆',n:'獵豹',d:'快速',b:270,g:1.45,m:740,gap:.85,x:1.5},
    {e:'🦅',n:'游隼',d:'變態難',b:340,g:1.8,m:900,gap:.75,x:2}
  ];
  var lv=2;try{var l0=parseInt(localStorage.getItem('rainbow-lv'));if(l0>=0&&l0<6)lv=l0}catch(e){}
  function cur(){return mp?LEVELS[2]:LEVELS[lv]}
  function bestKey(){return 'rainbow-best-'+(mp?2:lv)}
  function loadBest(){try{best=parseInt(localStorage.getItem(bestKey()))||0}catch(e){best=0}}
  function laneX(l){return LW*l+LW/2}
  function score(){return Math.round((Math.floor(dist/10)+coins*20)*cur().x)}
  function hud(){$('dist').textContent=Math.floor(dist)+' m';$('coins').textContent=coins;$('lives').textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(3-Math.max(0,lives))}

  /* ---------- 畫面切換 ---------- */
  function go(name){
    ['home','lobby','play'].forEach(function(n){$(n).hidden=n!==name});
    window.scrollTo(0,0);
    if(name==='play')layout();
  }
  function layout(){
    var aw=Math.min(innerWidth-24,480),ah=innerHeight-24-60-8-6;
    var h=Math.round(Math.max(520,Math.min(840,W*ah/aw)));
    if(h!==H){H=h;cv.height=H}
  }
  addEventListener('resize',function(){if(!$('play').hidden&&state!=='play')layout()});

  /* ---------- 暱稱 ---------- */
  var ADJ=['飛馳','閃電','快樂','勇敢','迷糊','機靈','熱血','悠哉','彩虹','超速'];
  var NOUN=['小橘','企鵝','海豚','柴犬','貓咪','鴨鴨','熊貓','狐狸','小豬','河馬'];
  function randNick(){return ADJ[Math.floor(Math.random()*ADJ.length)]+NOUN[Math.floor(Math.random()*NOUN.length)]+(10+Math.floor(Math.random()*90))}
  function nick(){return $('nick').value.trim().slice(0,12)}
  function saveNick(){try{localStorage.setItem('rainbow-nick',nick())}catch(e){}}
  function ensureNick(){if(!nick())$('nick').value=randNick();saveNick();return nick()}
  var n0='';try{n0=localStorage.getItem('rainbow-nick')||''}catch(e){}
  $('nick').value=n0||randNick();saveNick();

  /* ---------- 世界排行榜 ---------- */
  var REST=SB_URL+'/rest/v1/car_scores',rows=null;
  function board(){
    var list=rows?rows:demo.map(function(d){return{name:d[0],score:d[1]}});
    var nm=nick();
    $('board').innerHTML=list.map(function(r,i){
      var me=rows&&nm&&r.name===nm;
      return '<li class="'+(me?'me':'')+'"><span class="nm">'+(i+1)+'. '+esc(r.name)+'</span><span class="sc">'+r.score+'</span></li>'}).join('');
  }
  function loadBoard(){
    $('status').textContent='連線中…';
    return fetch(REST+'?select=name,score&order=score.desc&limit=100',{headers:HD}).then(function(r){
      if(!r.ok)throw 0;return r.json()}).then(function(j){
      var seen={},out=[];
      j.forEach(function(r){if(!seen[r.name]&&out.length<10){seen[r.name]=1;out.push(r)}});
      rows=out;$('status').textContent=out.length?'全世界玩家的前 10 名（每人取最高分）':'還沒有人上榜，成為第一名吧';board();
    }).catch(function(){rows=null;$('status').textContent='無法連線，顯示示範資料';board()});
  }
  function openBoard(){$('boardModal').hidden=false;loadBoard();$('closeBoard').focus()}
  function closeBoard(){$('boardModal').hidden=true}
  $('openBoard').onclick=openBoard;
  $('boardBtn').onclick=openBoard;
  $('closeBoard').onclick=closeBoard;
  $('refreshBoard').onclick=loadBoard;
  $('boardModal').addEventListener('click',function(e){if(e.target===$('boardModal'))closeBoard()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeBoard()});
  function submit(s,thenOpen){
    var nm=nick();
    var done=function(){loadBoard().then(function(){if(thenOpen&&state==='over')$('boardModal').hidden=false})};
    if(s<=0||!nm){if(thenOpen)done();return}
    fetch(REST,{method:'POST',headers:HD,body:JSON.stringify({name:nm,score:s})}).then(done,done);
  }

  /* ---------- 遊戲核心 ---------- */
  function show(o){
    var h=$('ovT');h.textContent=o.t||'';h.className=o.big?'big':'';
    $('ovP').textContent=o.p||'';$('ovP').hidden=!o.p;
    $('ovList').innerHTML=o.list||'';$('ovList').hidden=!o.list;
    $('go').hidden=!o.btn;$('go').textContent=o.btn||'';actGo=o.act||null;
    $('alt').hidden=!o.alt;$('alt').textContent=o.alt||'';actAlt=o.altAct||null;
    $('boardBtn').hidden=!o.board;
    var lc=$('ovLv');lc.hidden=!o.lv;if(o.lv)renderLv();
    $('ov').hidden=false;
  }
  function renderLv(){
    $('ovLv').innerHTML=LEVELS.map(function(L,i){
      return '<button type="button" class="lv" data-i="'+i+'" aria-pressed="'+(i===lv)+'"><span>'+L.e+'</span><b>'+L.n+'</b><small>'+L.d+(L.x!==1?' ×'+L.x:'')+'</small></button>'}).join('');
  }
  $('ovLv').addEventListener('click',function(e){
    var b=e.target.closest('.lv');if(!b)return;
    lv=+b.dataset.i;try{localStorage.setItem('rainbow-lv',lv)}catch(x){}
    loadBest();renderLv();setChip();
  });
  function setChip(){var c=$('lvChip');c.hidden=!!mp;c.textContent=LEVELS[lv].e+' '+LEVELS[lv].n}
  function reset(seed){
    rnd=seed==null?Math.random:mulberry(seed);
    lane=1;px=laneX(1);speed=cur().b;dist=0;wd=0;nextAt=300;coins=0;lives=3;inv=0;items=[];finished=false;hud();
  }
  function toHome(){
    if(mp)leave(true);
    state='ready';go('home');loadBoard();
  }
  function soloIntro(){
    ensureNick();if(mp)leave(true);
    go('play');
    $('mini').hidden=true;$('pause').hidden=false;
    reset();state='ready';loadBest();setChip();
    show({t:'選擇難度',p:'難度越高，分數加成越多。',lv:true,btn:'開始',act:startSolo,alt:'回首頁',altAct:toHome});
  }
  function startSolo(){loadBest();setChip();reset();state='play';$('ov').hidden=true;last=performance.now()}
  function endRun(){
    var s=score();
    if(s>best){best=s;try{localStorage.setItem(bestKey(),best)}catch(e){}}
    hud();state='over';submit(s,!mp);
    if(mp){
      mp.me.done=true;mp.me.fin=finished;sendProg(true);logEnd(finished?'finished':'crashed');
      show({t:finished?'完賽！':'撞車了！',p:'總分 '+s+'，等待其他玩家完成…'});
      checkAllDone();
    }else{
      show({t:'撞車了！',p:'總分 '+s+'（'+Math.floor(dist)+' 公尺、'+coins+' 枚金幣'+(cur().x!==1?'，難度加成 ×'+cur().x:'')+'）。'+LEVELS[lv].n+'個人最佳 '+best+'。',lv:true,btn:'再玩一次',act:startSolo,alt:'回首頁',altAct:toHome,board:true});
    }
  }
  function pause(){
    if(mp)return;
    if(state==='play'){state='pause';show({t:'暫停中',p:'準備好再繼續。',btn:'繼續',act:resume,alt:'回首頁',altAct:toHome})}
  }
  function resume(){if(state==='pause'){state='play';$('ov').hidden=true;last=performance.now()}}
  function move(d){if(state!=='play')return;lane=Math.max(0,Math.min(LANES-1,lane+d))}

  function addItem(){
    var l=Math.floor(rnd()*LANES),r=rnd(),t=r<.4?'coin':(r<.75?'car':'cone');
    var c=carColors[Math.floor(rnd()*carColors.length)],extra=rnd()<.5;
    items.push({t:t,l:l,y:-60,c:c,v:t==='car'?.45:0});
    if(t==='coin'&&extra){items.push({t:'coin',l:l,y:-120,c:0,v:0});items.push({t:'coin',l:l,y:-180,c:0,v:0})}
  }
  function update(dt){
    var L=cur();speed=Math.min(L.m,L.b+(Math.floor(dist/500)*35+dist*.02)*L.g);
    dist+=speed*dt/10; wd+=speed*dt; scroll=(scroll+speed*dt)%80;
    px+=(laneX(lane)-px)*Math.min(1,dt*14);
    if(wd>=nextAt){addItem();nextAt=wd+Math.max(.35,.9-speed/900)*speed*L.gap*(.8+rnd()*.5)}
    if(inv>0)inv-=dt; if(shake>0)shake-=dt;
    var py=H-110;
    items.forEach(function(it){
      it.y+=(speed*(1-it.v))*dt;
      if(it.dead)return;
      if(Math.abs(laneX(it.l)-px)<34&&Math.abs(it.y-py)<(it.t==='coin'?34:46)){
        if(it.t==='coin'){coins++;it.dead=true}
        else if(inv<=0){lives--;inv=1.4;shake=.3;it.dead=true}
      }
    });
    items=items.filter(function(it){return !it.dead&&it.y<H+80});
    hud();
    if(lives<=0){endRun();return}
    if(mp&&dist>=GOAL){finished=true;endRun()}
  }
  function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
  function car(x,y,c,flip){
    ctx.fillStyle='rgba(0,0,0,.25)';rr(x-26,y-40,56,86,12);ctx.fill();
    ctx.fillStyle=c;rr(x-28,y-44,56,86,12);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';rr(x-20,y-(flip?22:30),40,22,6);ctx.fill();
    ctx.fillStyle='#17324a';ctx.fillRect(x-33,y-30,6,18);ctx.fillRect(x+27,y-30,6,18);ctx.fillRect(x-33,y+14,6,18);ctx.fillRect(x+27,y+14,6,18);
    ctx.fillStyle='#ffe27a';ctx.fillRect(x-22,y-(flip?-34:44),10,6);ctx.fillRect(x+12,y-(flip?-34:44),10,6);
  }
  function draw(){
    ctx.save();
    if(shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
    ctx.fillStyle=tok('--grass');ctx.fillRect(0,0,W,H);
    ctx.fillStyle=tok('--road');ctx.fillRect(6,0,W-12,H);
    ctx.fillStyle=tok('--lane');
    for(var i=1;i<LANES;i++)for(var y=-80;y<H;y+=80)ctx.fillRect(LW*i-3,y+scroll,6,40);
    items.forEach(function(it){
      var x=laneX(it.l);
      if(it.t==='coin'){
        ctx.fillStyle=tok('--coin');ctx.beginPath();ctx.arc(x,it.y,15,0,7);ctx.fill();
        ctx.strokeStyle='#b8860b';ctx.lineWidth=3;ctx.stroke();
        ctx.fillStyle='#b8860b';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('$',x,it.y+6);
      }else if(it.t==='cone'){
        ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.moveTo(x,it.y-28);ctx.lineTo(x+22,it.y+22);ctx.lineTo(x-22,it.y+22);ctx.fill();
        ctx.fillStyle='#fff';ctx.fillRect(x-12,it.y,24,8);
      }else car(x,it.y,it.c,true);
    });
    if(mp&&(state==='play'||state==='over')&&GOAL-dist<60&&GOAL-dist>0){
      ctx.fillStyle='#fff';ctx.fillRect(6,70,W-12,10);ctx.fillStyle='#17324a';
      for(var k=0;k<12;k++)if(k%2)ctx.fillRect(6+k*(W-12)/12,70,(W-12)/12,10);
    }
    if(inv<=0||Math.floor(inv*12)%2===0)car(px,H-110,tok('--accent'),false);
    ctx.restore();
  }
  function loop(t){
    var dt=Math.min(.05,(t-last)/1000);last=t;
    if(state==='play'){
      update(dt);
      if(mp&&state==='play'&&t-mp.lastSend>300){mp.lastSend=t;sendProg(false)}
    }
    if(!$('play').hidden)draw();
    requestAnimationFrame(loop);
  }

  /* ---------- 多人房間（Supabase Realtime） ---------- */
  var CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function homeMsg(t,err){var e=$('homeMsg');e.textContent=t;e.className='status'+(err?' err':'')}
  function genCode(){var s='';for(var i=0;i<4;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s}
  function saveRoom(){
    if(!mp)return;
    try{sessionStorage.setItem('rainbow-room',JSON.stringify({code:mp.code,id:mp.id,joinedAt:mp.joinedAt,create:mp.create,t:Date.now()}))}catch(e){}
  }
  function clearRoom(){try{sessionStorage.removeItem('rainbow-room')}catch(e){}}
  function connect(code,create,saved){
    var nm=ensureNick();
    if(!sb){homeMsg('無法載入連線元件，請檢查網路後重新整理頁面。',true);return}
    leave(true);
    mp={ch:null,id:saved?saved.id:Math.random().toString(36).slice(2,10),code:code,name:nm,joinedAt:saved?saved.joinedAt:Date.now(),
      players:[],prog:{},expected:[],phase:'lobby',create:create,restored:!!saved,checked:false,lastSend:0,me:{done:false,fin:false},timer:null,rank:0,retry:0,retryTimer:0,hiddenAt:0};
    saveRoom();
    homeMsg('連線中…');
    attach();
    $('roomCode').textContent=code;
    homeMsg('');go('lobby');renderMp();
  }
  /* 建立或重建頻道（切到 LINE 再回來、網路中斷時會重連，房號、身分與房主資格都保留） */
  function attach(){
    var m=mp;
    if(m.ch){try{m.ch.untrack();sb.removeChannel(m.ch)}catch(e){}}
    var ch=sb.channel('car-room-'+m.code,{config:{presence:{key:m.id},broadcast:{self:true}}});
    m.ch=ch;
    ch.on('presence',{event:'sync'},function(){if(mp&&mp.ch===ch)onSync()})
      .on('broadcast',{event:'start'},function(x){if(mp&&mp.ch===ch)onStart(x.payload)})
      .on('broadcast',{event:'prog'},function(x){if(mp&&mp.ch===ch)onProg(x.payload)})
      .subscribe(function(st){
        if(!mp||mp.ch!==ch)return;
        if(st==='SUBSCRIBED'){
          m.retry=0;
          ch.track({name:m.name,joinedAt:m.joinedAt}).then(function(){
            if(m.create||m.restored||m.checked)return;
            m.checked=true;
            setTimeout(function(){
              if(mp===m&&m.players.length<2){leave(true);go('home');homeMsg('找不到房號 '+m.code+'，請確認房號，或請朋友先建立房間。',true)}
            },1500);
          });
        }else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')retryLater();
      });
  }
  function retryLater(){
    var m=mp;if(!m||m.retryTimer)return;
    m.retry++;
    if(m.retry>6){leave(true);go('home');homeMsg('連線中斷，請重新加入房間。',true);return}
    m.retryTimer=setTimeout(function(){m.retryTimer=0;if(mp===m)attach()},1200*m.retry);
  }
  function leave(silent){
    if(!mp)return;
    if(ses&&!ses.ended&&mp.phase==='race')logEnd('left');
    var m=mp;mp=null;clearInterval(m.timer);clearTimeout(m.retryTimer);clearRoom();
    try{m.ch.untrack();sb.removeChannel(m.ch)}catch(e){}
    state='ready';
    if(!silent){go('home');loadBoard()}
  }
  document.addEventListener('visibilitychange',function(){
    if(!mp)return;
    if(document.hidden){mp.hiddenAt=Date.now();return}
    saveRoom();
    if(Date.now()-mp.hiddenAt>3000){mp.retry=0;clearTimeout(mp.retryTimer);mp.retryTimer=0;attach()}
  });
  function onSync(){
    var st=mp.ch.presenceState();
    mp.players=Object.keys(st).map(function(k){return{id:k,name:st[k][0].name,joinedAt:st[k][0].joinedAt}})
      .sort(function(a,b){return a.joinedAt-b.joinedAt||(a.id<b.id?-1:1)});
    renderMp();
    if(mp.phase==='race')checkAllDone();
  }
  function isHost(){return !!mp&&mp.players.length>0&&mp.players[0].id===mp.id}
  function onStart(p){
    mp.phase='race';mp.prog={};mp.rank=0;mp.me={done:false,fin:false};
    mp.expected=mp.players.map(function(x){return x.id});
    if(mp.expected.indexOf(mp.id)<0)mp.expected.push(mp.id);
    $('mini').hidden=false;$('pause').hidden=true;setChip();loadBest();
    go('play');reset(p.seed);state='count';
    logStart();
    var n=3;show({t:String(n),big:true});
    renderMp();
    clearInterval(mp.timer);
    var m=mp;
    m.timer=setInterval(function(){
      n--;
      if(n>0){$('ovT').textContent=n}
      else{clearInterval(m.timer);$('ovT').textContent='出發！';
        setTimeout(function(){if(mp===m&&state==='count'){state='play';$('ov').hidden=true;last=performance.now();m.lastSend=0}},350)}
    },1000);
  }
  function sendProg(done){
    var p={id:mp.id,name:mp.name,dist:Math.floor(dist),score:score(),lives:lives,done:!!done,fin:finished};
    mp.prog[mp.id]=p;
    mp.ch.send({type:'broadcast',event:'prog',payload:p});
    renderMp();
  }
  function onProg(p){
    if(!p||!p.id)return;
    mp.prog[p.id]=p;renderMp();checkAllDone();
  }
  function ranking(){
    var present=mp.players.map(function(x){return x.id});
    return mp.expected.filter(function(id){return mp.prog[id]&&(present.indexOf(id)>-1||mp.prog[id].done)})
      .map(function(id){return mp.prog[id]}).sort(function(a,b){return b.score-a.score});
  }
  function rankHtml(list,withBar){
    return list.map(function(p,i){
      var tag=p.done?(p.fin?'完賽':'出局'):'';
      var bar=withBar?'<div class="prog"><i style="width:'+Math.min(100,p.dist/GOAL*100)+'%"></i></div>':'';
      return '<li class="'+(p.id===mp.id?'me':'')+'"><div class="rl"><span class="nm">'+(i+1)+'. '+esc(p.name)+(tag?'<span class="badge good">'+tag+'</span>':'')+'</span>'+bar+'</div><span class="sc">'+p.score+'</span></li>'}).join('');
  }
  function checkAllDone(){
    if(!mp||mp.phase!=='race'||!mp.me.done)return;
    var present=mp.players.map(function(x){return x.id});
    var wait=mp.expected.filter(function(id){return present.indexOf(id)>-1&&!(mp.prog[id]&&mp.prog[id].done)});
    if(wait.length)return;
    mp.phase='results';
    var list=ranking();
    for(var i=0;i<list.length;i++)if(list[i].id===mp.id)mp.rank=i+1;
    logEnd(finished?'finished':'crashed',mp.rank,list.length);
    show({t:mp.rank===1?'冠軍！':'第 '+mp.rank+' 名',p:'共 '+list.length+' 人，你的總分 '+score()+(isHost()?'':'。等房主再開一場。'),
      list:rankHtml(list,false),btn:isHost()?'再來一場':'',act:startRaceMsg,alt:'回房間大廳',altAct:function(){go('lobby');renderMp()},board:true});
    renderMp();
  }
  function renderMp(){
    if(!mp)return;
    var host=isHost(),ph=mp.phase,html='';
    if(ph==='lobby'){
      $('phaseText').textContent=host?'你是房主。人到齊後按「開始比賽」。':'等待房主開始比賽…';
      html=mp.players.map(function(p){
        return '<li class="'+(p.id===mp.id?'me':'')+'"><span class="nm">'+esc(p.name)+(p.id===mp.players[0].id?'<span class="badge">房主</span>':'')+(p.id===mp.id?'<span class="badge good">你</span>':'')+'</span></li>'}).join('');
    }else{
      $('phaseText').textContent=ph==='race'?'比賽進行中，即時名次：':'上一場的名次（房主可以再開一場）：';
      html=rankHtml(ranking(),ph==='race');
    }
    $('plist').innerHTML=html;
    var mr=ph==='lobby'?[]:ranking();
    $('mini').innerHTML=mr.slice(0,4).map(function(p,i){return '<span class="'+(p.id===mp.id?'me':'')+'">'+(i+1)+'. '+esc(p.name)+' '+p.score+'</span>'}).join('');
    var b=$('startRace');
    b.hidden=!(ph==='lobby'||ph==='results');
    b.disabled=!host;
    b.textContent=host?(ph==='results'?'再來一場':'開始比賽'):'等待房主開始';
  }
  function startRaceMsg(){
    if(!mp||!isHost()||mp.phase==='race')return;
    mp.ch.send({type:'broadcast',event:'start',payload:{seed:Math.floor(Math.random()*2147483647)}});
  }
  function inviteLink(){return location.origin+location.pathname+'?room='+mp.code}

  /* ---------- 多人場次紀錄（送到 Supabase Edge Function） ---------- */
  var LOG_URL=SB_URL+'/functions/v1/log-session',ses=null;
  function uuid(){
    if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});
  }
  function pid(){
    var v='';try{v=localStorage.getItem('rainbow-pid')||''}catch(e){}
    if(!v){v=uuid();try{localStorage.setItem('rainbow-pid',v)}catch(e){}}
    return v;
  }
  function postLog(body){
    try{fetch(LOG_URL,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)}).catch(function(){})}catch(e){}
  }
  function logStart(){
    var ref='';try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}
    var info={sid:uuid(),event:'start',player_id:pid(),nickname:mp.name,mode:'multi',level:'循序漸進',room_code:mp.code,players_count:mp.expected.length,
      screen:innerWidth+'x'+innerHeight,lang:navigator.language,tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||''),referrer:ref,
      dark_mode:matchMedia('(prefers-color-scheme:dark)').matches,touch:('ontouchstart' in window)||navigator.maxTouchPoints>0};
    ses={sid:info.sid,t0:Date.now(),ended:false};
    var send=function(){postLog(info)};
    if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){
      navigator.userAgentData.getHighEntropyValues(['model']).then(function(v){if(v&&v.model)info.device_model=v.model;send()},send);
    }else send();
  }
  function logEnd(reason,rank,count){
    if(!ses)return;
    postLog({sid:ses.sid,event:'end',score:score(),distance:Math.floor(dist),coins:coins,duration_s:Math.round((Date.now()-ses.t0)/1000),end_reason:reason,rank:rank||undefined,players_count:count||undefined});
    ses.ended=true;
  }

  /* ---------- 事件 ---------- */
  $('go').onclick=function(){if(actGo)actGo()};
  $('alt').onclick=function(){if(actAlt)actAlt()};
  $('pause').onclick=pause;
  $('exit').onclick=function(){
    if(mp&&mp.phase==='race'&&state==='play'){
      show({t:'要離開比賽嗎？',p:'離開房間後，這場成績不計入名次。',btn:'繼續比賽',act:function(){$('ov').hidden=true},alt:'離開房間',altAct:function(){leave()}});
    }else if(mp){go('lobby');renderMp()}
    else if(state==='play'){pause()}
    else toHome();
  };
  $('L').onclick=function(){move(-1)};
  $('R').onclick=function(){move(1)};
  document.addEventListener('keydown',function(e){
    if(/INPUT|TEXTAREA/.test(e.target.tagName)){if(e.key==='Enter'&&e.target.id==='code')$('join').click();return}
    var k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'){move(-1);e.preventDefault()}
    else if(k==='ArrowRight'||k==='d'||k==='D'){move(1);e.preventDefault()}
  });
  var sx=null;
  $('stage').addEventListener('pointerdown',function(e){sx=e.clientX});
  $('stage').addEventListener('pointerup',function(e){
    if(sx===null)return;var d=e.clientX-sx;sx=null;
    if(e.target.closest('button,.overlay'))return;
    if(Math.abs(d)>25)move(d>0?1:-1);
    else{var r=$('stage').getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)}
  });
  function theme(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.dataset.theme=dark?'light':'dark';
  }
  ['theme1','theme2','theme3'].forEach(function(i){$(i).onclick=theme});
  $('nick').addEventListener('change',function(){ensureNick();board()});
  $('dice').onclick=function(){$('nick').value=randNick();saveNick();board()};
  $('create').onclick=function(){connect(genCode(),true)};
  $('join').onclick=function(){
    var c=$('code').value.trim().toUpperCase();
    if(c.length!==4){homeMsg('房號是 4 個英數字。',true);return}
    connect(c,false);
  };
  $('solo').onclick=soloIntro;
  $('leave').onclick=function(){leave()};
  $('startRace').onclick=startRaceMsg;
  $('share').onclick=function(){
    if(!mp)return;
    var data={title:'彩虹公路小賽車',text:'一起來玩！房號 '+mp.code+'，點連結直接加入：',url:inviteLink()};
    if(navigator.share){navigator.share(data).catch(function(){})}
    else $('copy').click();
  };
  $('copy').onclick=function(e){
    if(!mp)return;var link=inviteLink(),b=$('copy');
    function done(t){b.textContent=t;setTimeout(function(){b.textContent='複製邀請連結'},1800)}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){done('已複製')},function(){$('phaseText').textContent='請手動複製：'+link});
    }else $('phaseText').textContent='請手動複製：'+link;
  };

  hud();last=performance.now();requestAnimationFrame(loop);
  var qr=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  var saved=null;
  try{saved=JSON.parse(sessionStorage.getItem('rainbow-room')||'null')}catch(e){}
  if(saved&&saved.code&&Date.now()-saved.t<30*60*1000&&(qr.length!==4||qr===saved.code)){connect(saved.code,saved.create,saved);return}
  if(qr.length===4){
    $('code').value=qr;$('invite').hidden=false;$('invite').textContent='朋友邀請你加入房間 '+qr+'，按「加入」就能一起玩。';
    $('create').classList.remove('primary');$('join').classList.add('primary');
  }
})();
</script>
